# =============================================================================
# Integration Tests Workflow
# =============================================================================
#
# This workflow runs integration tests against live provider APIs.
# It requires API keys stored as GitHub secrets.
#
# Required Secrets:
#   - OPENAI_API_KEY: OpenAI API key for OpenAI integration tests
#   - ANTHROPIC_API_KEY: Anthropic API key for Anthropic integration tests
#
# Optional Secrets (for other providers):
#   - GEMINI_API_KEY
#   - GROQ_API_KEY
#
# Manual Trigger:
#   You can manually trigger this workflow from the Actions tab
#   and optionally specify which provider to test.
#
# Usage:
#   - Smoke tests run on every PR (fast, ~30s per provider)
#   - Full tests run on main merge and weekly schedule
#
# =============================================================================

name: Integration Tests

on:
  # Run on pushes to main (after PR merge)
  push:
    branches: [main]
    paths:
      - 'arcllm/**'
      - 'tests/**'
      - 'pyproject.toml'

  # Run on PRs to main
  pull_request:
    branches: [main]
    paths:
      - 'arcllm/**'
      - 'tests/**'

  # Allow manual trigger
  workflow_dispatch:
    inputs:
      provider:
        description: 'Provider to test (openai, anthropic, or all)'
        required: false
        default: 'all'
        type: choice
        options:
          - all
          - openai
          - anthropic
      test_type:
        description: 'Test type to run'
        required: false
        default: 'smoke'
        type: choice
        options:
          - smoke
          - full
          - all

  # Run weekly to catch API changes
  schedule:
    - cron: '0 6 * * 1'  # Every Monday at 6 AM UTC

# ===========================================================================
# Environment variables for all jobs
# ===========================================================================
env:
  ARCLLM_CI_MODE: 'true'
  PYTHONUNBUFFERED: '1'

jobs:
  # ===========================================================================
  # OpenAI Integration Tests
  # ===========================================================================
  openai-integration:
    name: OpenAI Integration Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # Only run if we have the API key secret
    if: |
      (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) &&
      (github.event.inputs.provider == 'all' || github.event.inputs.provider == 'openai' || github.event.inputs.provider == '')

    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.12']

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run OpenAI smoke tests (PR)
        if: github.event_name == 'pull_request' || github.event.inputs.test_type == 'smoke'
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          echo "Running OpenAI smoke tests..."
          pytest tests/integration/test_openai_integration.py \
            -v \
            --tb=short \
            -m "smoke" \
            --timeout=60 \
            --junitxml=junit-openai-smoke.xml || true

      - name: Run OpenAI full tests (main/schedule)
        if: github.event_name == 'push' || github.event_name == 'schedule' || github.event.inputs.test_type == 'full' || github.event.inputs.test_type == 'all'
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          echo "Running full OpenAI integration tests..."
          pytest tests/integration/test_openai_integration.py \
            -v \
            --tb=short \
            --timeout=120 \
            --junitxml=junit-openai-full.xml

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: openai-test-results
          path: junit-openai*.xml

  # ===========================================================================
  # Anthropic Integration Tests
  # ===========================================================================
  anthropic-integration:
    name: Anthropic Integration Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # Only run if we have the API key secret
    if: |
      (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) &&
      (github.event.inputs.provider == 'all' || github.event.inputs.provider == 'anthropic' || github.event.inputs.provider == '')

    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.12']

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run Anthropic smoke tests (PR)
        if: github.event_name == 'pull_request' || github.event.inputs.test_type == 'smoke'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          echo "Running Anthropic smoke tests..."
          pytest tests/integration/test_anthropic_integration.py \
            -v \
            --tb=short \
            -m "smoke" \
            --timeout=60 \
            --junitxml=junit-anthropic-smoke.xml || true

      - name: Run Anthropic full tests (main/schedule)
        if: github.event_name == 'push' || github.event_name == 'schedule' || github.event.inputs.test_type == 'full' || github.event.inputs.test_type == 'all'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          echo "Running full Anthropic integration tests..."
          pytest tests/integration/test_anthropic_integration.py \
            -v \
            --tb=short \
            --timeout=120 \
            --junitxml=junit-anthropic-full.xml

      - name: Run comprehensive Anthropic model tests
        if: github.event_name == 'schedule' || github.event.inputs.test_type == 'all'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          echo "Running comprehensive Anthropic model tests..."
          python examples/test_anthropic_models.py || true

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: anthropic-test-results
          path: junit-anthropic*.xml

  # ===========================================================================
  # Full Provider Integration Tests (on schedule or manual)
  # ===========================================================================
  full-integration:
    name: Full Provider Integration Tests
    runs-on: ubuntu-latest
    timeout-minutes: 45

    # Only run on schedule or manual trigger with 'all' test_type
    if: github.event_name == 'schedule' || github.event.inputs.test_type == 'all'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run all provider integration tests
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          echo "Running all provider integration tests..."
          pytest tests/integration/ \
            -v \
            --tb=short \
            --timeout=180 \
            --junitxml=junit-all-providers.xml

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: full-integration-results
          path: junit-*.xml

  # ===========================================================================
  # Test Results Summary
  # ===========================================================================
  results:
    name: Test Results Summary
    runs-on: ubuntu-latest
    needs: [openai-integration, anthropic-integration]
    if: always()

    steps:
      - name: Download all test results
        uses: actions/download-artifact@v4
        with:
          path: test-results
        continue-on-error: true

      - name: Summary
        run: |
          echo "## Integration Test Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Provider | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|----------|--------|" >> $GITHUB_STEP_SUMMARY
          
          if [ "${{ needs.openai-integration.result }}" == "success" ]; then
            echo "| OpenAI | ✅ Passed |" >> $GITHUB_STEP_SUMMARY
          elif [ "${{ needs.openai-integration.result }}" == "skipped" ]; then
            echo "| OpenAI | ⏭️ Skipped |" >> $GITHUB_STEP_SUMMARY
          else
            echo "| OpenAI | ❌ Failed |" >> $GITHUB_STEP_SUMMARY
          fi
          
          if [ "${{ needs.anthropic-integration.result }}" == "success" ]; then
            echo "| Anthropic | ✅ Passed |" >> $GITHUB_STEP_SUMMARY
          elif [ "${{ needs.anthropic-integration.result }}" == "skipped" ]; then
            echo "| Anthropic | ⏭️ Skipped |" >> $GITHUB_STEP_SUMMARY
          else
            echo "| Anthropic | ❌ Failed |" >> $GITHUB_STEP_SUMMARY
          fi
          
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Test Artifacts" >> $GITHUB_STEP_SUMMARY
          echo "JUnit XML reports are available in the workflow artifacts." >> $GITHUB_STEP_SUMMARY
