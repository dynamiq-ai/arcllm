name: Release

# Triggered by pushing a tag of the form `v0.4.0`, `v0.4.1-rc1`, etc.
# Steps:
#   1. Build wheel + sdist
#   2. Verify the package version matches the tag (catches the
#      "forgot to bump pyproject.toml before tagging" mistake)
#   3. Publish to PyPI via Trusted Publishing (preferred; no token to rotate)
#      — falls back to the PYPI_API_TOKEN secret if Trusted Publishing isn't
#      configured for the repo yet.
#   4. Attach the wheel + sdist to a GitHub Release with auto-generated
#      release notes from PR titles since the previous tag.

on:
  push:
    tags:
      - "v*"

env:
  PYTHON_VERSION: "3.12"

jobs:
  build:
    name: Build distributions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install build tooling
        run: |
          python -m pip install --upgrade pip
          pip install build twine

      - name: Build wheel and sdist
        run: python -m build

      - name: Verify metadata (twine check)
        run: twine check --strict dist/*

      - name: Verify tag matches pyproject version
        run: |
          tag="${GITHUB_REF#refs/tags/v}"
          # Scrape the version line directly so we don't depend on
          # ``tomllib`` (3.11+) or pull in ``tomli`` just for one line.
          pkg_version=$(python -c "import pathlib, re; m = re.search(r'^version\s*=\s*\"([^\"]+)\"', pathlib.Path('pyproject.toml').read_text(), re.M); print(m.group(1) if m else '')")
          if [ -z "$pkg_version" ]; then
            echo "::error ::Could not read [project].version from pyproject.toml"
            exit 1
          fi
          if [ "$tag" != "$pkg_version" ]; then
            echo "::error ::Tag v$tag does not match pyproject.toml version $pkg_version"
            exit 1
          fi
          echo "OK: tag v$tag matches pyproject version $pkg_version"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish-pypi:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    # 'pypi' environment lets us scope the Trusted Publisher / API token
    # to release builds only, and adds a manual approval gate if the org
    # configures one in repo settings.
    environment:
      name: pypi
      url: https://pypi.org/p/arcllm-sdk
    permissions:
      # Required for PyPI Trusted Publishing (OIDC). If not yet configured,
      # the action falls back to the PYPI_API_TOKEN repo secret.
      id-token: write
    steps:
      - name: Download dist artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          # If Trusted Publishing is configured on PyPI for this repo, the
          # action will use OIDC and ignore the password. Otherwise it falls
          # back to the API token in `password`.
          password: ${{ secrets.PYPI_API_TOKEN }}
          # Don't fail the job if the version was already uploaded (rare,
          # but happens if a previous run partially succeeded).
          skip-existing: true

  github-release:
    name: Create GitHub Release
    needs: publish-pypi
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          # Need full history for `gh release create --generate-notes` to
          # diff against the previous tag.
          fetch-depth: 0

      - name: Download dist artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${GITHUB_REF#refs/tags/}"
          # Mark prereleases (anything with -rc, -alpha, -beta) so they
          # don't show up as the latest release on the repo homepage.
          extra=()
          if [[ "$tag" =~ -(rc|alpha|beta)[0-9]*$ ]]; then
            extra+=(--prerelease)
          fi
          gh release create "$tag" dist/* \
            --title "arcllm-sdk $tag" \
            --generate-notes \
            "${extra[@]}"
